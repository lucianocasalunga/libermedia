    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LiberMedia" />
    <title>LiberMedia</title>
    <meta name="description" content="Rede social descentralizada no protocolo Nostr — sem censura, sem algoritmos opacos, sem depender de uma empresa centralizada." />
    <!-- Open Graph / Social Preview — capa do link https://media.libernet.app (URLs absolutas: crawlers não rodam JS nem resolvem relativo) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LiberMedia" />
    <meta property="og:title" content="LiberMedia — Rede Social Nostr" />
    <meta property="og:description" content="Rede social descentralizada no protocolo Nostr — sem censura, sem algoritmos opacos, sem depender de uma empresa centralizada." />
    <meta property="og:image" content="https://media.libernet.app/s/cn4QyE.png" />
    <meta property="og:image:width" content="1154" />
    <meta property="og:image:height" content="886" />
    <meta property="og:url" content="https://media.libernet.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LiberMedia — Rede Social Nostr" />
    <meta name="twitter:description" content="Rede social descentralizada no protocolo Nostr." />
    <meta name="twitter:image" content="https://media.libernet.app/s/cn4QyE.png" />
    <!-- Tema: aplica a classe antes do CSS para evitar flash (FOIT).
         Mesma chave/classes do app Flask (templates/base.html). -->
    <script>
      (function () {
        var t = localStorage.getItem('libermedia_theme');
        var valid = ['theme-noite', 'theme-abismo', 'theme-penumbra', 'theme-bruma', 'theme-neve', 'theme-areia'];
        document.documentElement.classList.add(valid.indexOf(t) !== -1 ? t : 'theme-noite');
      })();
    </script>
    <!-- Self-heal: a cada deploy o bundle Vite hasheado muda e o anterior é apagado
         (rsync --delete). No PWA iOS, a 1ª abertura pós-deploy ainda usa o SW antigo,
         que serve um shell em cache apontando pro hash MORTO → script 400/404 → tela
         branca. Aqui captamos a falha de carga do bundle (/assets/) e, UMA vez por
         lançamento, desregistramos o SW + limpamos os caches + recarregamos. O usuário
         deixa de ver branco (auto-recupera na própria 1ª abertura). -->
    <script>
      (function () {
        var KEY = 'lm_selfheal_ts';
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (!el || el.tagName !== 'SCRIPT') return;
          var src = el.src || '';
          if (src.indexOf('/assets/') === -1) return; // só o bundle do app
          var last = +(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 30000) return;       // anti-loop: 1 reload/30s
          sessionStorage.setItem(KEY, String(Date.now()));
          Promise.resolve()
            .then(function () {
              if ('serviceWorker' in navigator)
                return navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                });
            })
            .then(function () {
              if (window.caches && caches.keys)
                return caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                });
            })
            .catch(function () {})
            .then(function () { location.reload(); });
        }, true); // capture: falha de carregamento de recurso não borbulha
      })();
    </script>
    <!-- Splash de abertura: logo pulsando enquanto o app carrega (estilo X/Twitter).
         Inline → pinta INSTANTÂNEO, antes do bundle, cobrindo o vão de carregamento
         (fim da tela branca/preta). Some quando o React pinta o 1º frame. -->
    <link rel="preload" as="image" href="%BASE_URL%icon-192.png" />
    <style>
      #lm-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: #000000; opacity: 1; transition: opacity .4s ease;
      }
      html.theme-penumbra #lm-splash { background: #0a0a0f; }
      html.theme-bruma #lm-splash, html.theme-neve #lm-splash { background: #ffffff; }
      html.theme-areia #lm-splash { background: #fafaf8; }
      #lm-splash.lm-splash-out { opacity: 0; pointer-events: none; }
      #lm-splash-logo {
        width: 88px; height: 88px; border-radius: 20%;
        animation: lm-splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes lm-splash-pulse {
        0%, 100% { transform: scale(.9); opacity: .6; }
        50%      { transform: scale(1);  opacity: 1;  }
      }
      @media (prefers-reduced-motion: reduce) {
        #lm-splash-logo { animation: none; opacity: 1; }
      }
    </style>
    <script>
      (function () {
        var done = false;
        window.__lmHideSplash = function () {
          if (done) return; done = true;
          var s = document.getElementById('lm-splash');
          if (!s) return;
          s.classList.add('lm-splash-out');
          setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 450);
        };
        // Fallback: nunca prender o usuário na splash se o JS do app não rodar.
        setTimeout(window.__lmHideSplash, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="lm-splash" role="presentation" aria-hidden="true">
      <img id="lm-splash-logo" src="%BASE_URL%icon-192.png" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
